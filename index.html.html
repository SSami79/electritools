<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>ElectriTools</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Barlow',sans-serif;background:#0d0d0f;color:white;min-height:100vh;padding-bottom:80px}
input,button,select,textarea{font-family:'Barlow',sans-serif}
a{text-decoration:none}
input:focus,select:focus,textarea:focus{border-color:#fbbf24!important;outline:none}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
select{-webkit-appearance:none}
button{cursor:pointer}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fadeUp .2s ease forwards}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1s linear infinite;display:inline-block}

/* Header */
#hdr{background:#111114;border-bottom:1px solid #1e1e24;position:sticky;top:0;z-index:100}
#hdr-in{max-width:660px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:22px;letter-spacing:2px;color:white;line-height:1}
.logo span{color:#fbbf24}
.logo-sub{font-size:10px;color:#555;letter-spacing:1.5px;margin-top:2px;text-transform:uppercase}
.hdr-stripe{height:3px;background:linear-gradient(90deg,#fbbf24,#f59e0b,#d97706)}
#plan-btn{border:1px solid rgba(85,85,85,.3);border-radius:20px;padding:5px 14px;font-size:12px;font-weight:700;background:rgba(85,85,85,.15);color:#555}

/* Bottom nav */
#bnav{position:fixed;bottom:0;left:0;right:0;z-index:200;background:#111114;border-top:1px solid #1e1e24;display:flex;height:62px;box-shadow:0 -4px 24px rgba(0,0,0,.4)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:transparent;border:none;color:#444;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;position:relative;padding:6px 4px}
.tab.on{color:#fbbf24}
.tab.on::before{content:'';position:absolute;top:0;left:20%;right:20%;height:2px;background:#fbbf24;border-radius:0 0 2px 2px}
.tab-ic{font-size:19px;line-height:1}

/* Drawer */
#overlay{position:fixed;inset:0;z-index:180;background:rgba(0,0,0,.5);display:none}
#overlay.on{display:block}
#drawer{position:fixed;bottom:62px;left:0;right:0;z-index:190;background:#111114;border-top:1px solid #1e1e24;transform:translateY(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);max-height:65vh;overflow-y:auto}
#drawer.on{transform:translateY(0)}
.drw-in{max-width:660px;margin:0 auto;padding:14px}
.drw-ttl{font-size:10px;font-weight:700;letter-spacing:2px;color:#444;text-transform:uppercase;margin-bottom:10px}
.drw-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.drw-item{display:flex;align-items:center;gap:10px;background:#16161a;border:1px solid #1e1e24;border-radius:10px;padding:11px 12px;color:#aaa;font-size:13px;font-weight:600;text-align:left;position:relative;transition:border-color .15s}
.drw-item.on{border-color:rgba(251,191,36,.3);color:#fbbf24;background:#1e1a08}
.drw-ic{font-size:19px}
.drw-lock{position:absolute;top:5px;right:7px;font-size:9px;color:#444}

/* Body */
#body{max-width:660px;margin:0 auto;padding:16px 16px 10px}

/* Cards */
.card{background:#16161a;border:1px solid #1e1e24;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
.clbl{font-size:10px;font-weight:700;letter-spacing:2px;color:#444;text-transform:uppercase}

/* Inputs */
.lbl{font-size:10px;font-weight:700;letter-spacing:1.5px;color:#555;text-transform:uppercase;margin-bottom:4px}
.inp{width:100%;background:#0d0d0f;border:1.5px solid #2a2a30;border-radius:8px;padding:10px 42px 10px 12px;color:white;font-size:19px;font-weight:600;font-family:'Barlow Condensed',sans-serif;transition:border-color .15s}
.inp-w{position:relative}
.inp-u{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:#444;font-size:13px;font-weight:700}
.sel{width:100%;background:#0d0d0f;border:1.5px solid #2a2a30;border-radius:8px;padding:10px 12px;color:white;font-size:13px;transition:border-color .15s}
textarea.inp{resize:vertical;font-size:13px;padding:10px 12px;height:70px}

/* Seg */
.segs{display:flex;gap:5px;flex-wrap:wrap}
.seg{background:#0d0d0f;border:1.5px solid #2a2a30;border-radius:6px;padding:8px 10px;color:#555;font-size:13px;font-weight:600;text-align:center;flex:1;transition:all .15s}
.seg.on{background:#1e1a08;border-color:#fbbf24;color:#fbbf24}

/* Buttons */
.btn{background:#fbbf24;border:none;border-radius:8px;padding:13px;color:#0d0d0f;font-size:14px;font-weight:800;letter-spacing:1.5px;font-family:'Barlow Condensed',sans-serif;width:100%}
.add-btn{background:transparent;border:1.5px dashed #2a2a30;border-radius:8px;padding:9px;color:#555;font-size:13px;font-weight:600;width:100%}
.rm-btn{background:none;border:none;color:#444;font-size:13px;padding:6px;border-radius:4px;flex-shrink:0}
.mini-btn{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.2);border-radius:6px;padding:4px 11px;color:#fbbf24;font-size:12px;font-weight:700}
.find-btn{background:#16161a;border:1.5px solid rgba(251,191,36,.3);border-radius:8px;padding:13px;color:#fbbf24;font-size:13px;font-weight:700;width:100%}

/* Info boxes */
.irow{display:flex;gap:8px;flex-wrap:wrap}
.ibox{flex:1;background:#0d0d0f;border:1px solid #1e1e24;border-radius:8px;padding:9px 7px;text-align:center;min-width:60px}
.inum{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:800;color:#fbbf24;line-height:1;margin-bottom:3px;word-break:break-all}
.ilbl{font-size:10px;color:#444;letter-spacing:.3px}

/* Pass/fail */
.pass{padding:11px;border-radius:8px;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:#22c55e;font-weight:700;font-size:14px}
.fail{padding:11px;border-radius:8px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#ef4444;font-weight:700;font-size:14px}

/* Table */
.thead{display:flex;padding:7px 10px;background:#0d0d0f;border-radius:6px;font-size:9px;font-weight:700;letter-spacing:1.5px;color:#444;text-transform:uppercase;margin-bottom:3px}
.trow{display:flex;align-items:center;padding:9px;border-bottom:1px solid #1a1a1f;border-radius:4px}
.trow.hl{background:rgba(251,191,36,.04);border:1px solid rgba(251,191,36,.12);border-radius:6px}

/* Top cards */
.tc-row{display:flex;gap:10px;margin-bottom:4px}
.tc{flex:1;background:#16161a;border:1px solid #1e1e24;border-radius:12px;padding:13px;display:flex;flex-direction:column;gap:3px}
.bnum{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:800;color:white;line-height:1}
.sub{font-size:11px;color:#555;margin-bottom:3px}
.dbadge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;align-self:flex-start}

/* Store */
.store-a{display:flex;align-items:center;gap:10px;background:#0d0d0f;border:1.5px solid #2a2a30;border-radius:10px;padding:12px;margin-bottom:7px;color:white}
.amz-a{display:flex;align-items:center;gap:10px;background:#0d0d0f;border:1.5px solid #2a2a30;border-radius:8px;padding:10px 12px;margin-bottom:7px;color:white}

/* Status */
.sbox{display:flex;align-items:center;justify-content:center;gap:10px;padding:18px 0;color:#aaa;font-size:13px}
.api-box{background:#0d0d0f;border:1px solid #2a2a30;border-radius:8px;padding:14px}

/* NEC */
.nec-item{background:#16161a;border:1px solid #1e1e24;border-radius:10px;padding:13px 15px;margin-bottom:7px;cursor:pointer;transition:border-color .15s}
.nec-item.on{border-color:rgba(251,191,36,.4)}

/* Exam */
.opt{background:#0d0d0f;border:1.5px solid #2a2a30;border-radius:8px;padding:11px 13px;color:#aaa;font-size:13px;font-weight:500;text-align:left;width:100%;margin-bottom:7px}
.opt.correct{background:rgba(34,197,94,.1);border-color:#22c55e;color:#22c55e}
.opt.wrong{background:rgba(239,68,68,.1);border-color:#ef4444;color:#ef4444}
.opt.picked{background:#1e1a08;border-color:#fbbf24;color:#fbbf24}

/* Lock */
.lock-wrap{position:relative}
.lock-ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;background:rgba(13,13,15,.9);border-radius:12px;z-index:10}

/* Plan card */
.pcard{background:#16161a;border:1px solid #1e1e24;border-radius:12px;padding:18px;margin-bottom:12px}

/* NEMA */
.nema-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nema-card{background:#0d0d0f;border:1px solid #2a2a30;border-radius:10px;padding:14px;text-align:center;cursor:pointer;transition:border-color .15s}
.nema-card.on{border-color:#fbbf24;background:#1e1a08}
.nema-detail{background:#0d0d0f;border:1px solid #fbbf2433;border-radius:10px;padding:16px;margin-top:10px}

/* Conduit bending */
.bend-result{background:#0d0d0f;border:1px solid #2a2a30;border-radius:8px;padding:12px;margin-top:4px}

/* Conversion */
.conv-result{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:800;color:#fbbf24;text-align:center;padding:16px 0}

/* Transformer */
.xfmr-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.xfmr-card{background:#0d0d0f;border:1px solid #2a2a30;border-radius:8px;padding:11px;cursor:pointer;transition:border-color .15s}
.xfmr-card.on{border-color:#fbbf24;background:#1e1a08}

/* Row */
.row{display:flex;gap:10px}
.row>div{flex:1}
#footer{text-align:center;font-size:11px;color:#2a2a30;margin-top:20px}
@media print{#hdr,#bnav,#drawer,#overlay,.no-print{display:none!important}body{background:white;padding:0}}
</style>
</head>

  {a:"100",t:"Definitions",s:"Branch Circuit: Conductors from final OCP to outlets.\nContinuous Load: 3+ hours — size at 125%.\nFeeder: Conductors from service to branch circuit OCP.\nAmpacity: Max current without exceeding temp rating.\nEGC: Equipment ground — safety ground (green or bare).\nGrounded Conductor: Neutral (white/gray)."},
  {a:"110",t:"Requirements for Electrical Installations",s:"Working Space: Min 3 ft depth, 30 in wide, 6.5 ft high in front of panels. No storage.\nTemp Ratings: Most terminations 75C. Never use 90C column for termination sizing — derating only.\nAll disconnects must be labeled. Equipment must be securely fastened."},

function wr(amps,d,vol,mat,ph){
  const at=mat==="copper"?CAMP:AAMP,rt=mat==="copper"?CRES:ARES,m=ph==="3ph"?Math.sqrt(3):2;
  return GO.filter(g=>at[g]&&at[g]>=amps&&rt[g]).map(g=>{const vd=(m*amps*rt[g]*d)/1000;return{g,amp:at[g],vd,pct:(vd/vol)*100}});
}

/* ── Conduit Bending ── */
const BMULT={".5":{offset:6.4,sad:2.5},".75":{offset:6.4,sad:2.5},"1":{offset:6.0,sad:2.5},"1.25":{offset:5.7,sad:2.5},"1.5":{offset:5.3,sad:2.5},"2":{offset:5.0,sad:2.5}};
const BDEG={10:.175,22.5:.383,30:.500,45:.707,60:.866};

function rBend(){
  const s=S.bend;
  const offset=parseFloat(s.offset)||0;
  const dist=parseFloat(s.dist)||0;
  const mult=BMULT[s.size]||{offset:6.0,sad:2.5};

  let results="";
  if(s.type==="offset"&&offset>0){
    const deg45=offset/mult.offset*6.4;
    const shrink=offset*.25;
    results=`<div class="bend-result">
      <div class="lbl" style="margin-bottom:8px">45° Offset — Rise: ${offset}"</div>
      <div class="irow">
        ${ib((offset/mult.offset*6.4).toFixed(2)+'"',"Mark Distance")}
        ${ib(shrink.toFixed(3)+'"',"Shrink")}
        ${ib("45°","Both Bends")}
      </div>
      <div style="margin-top:10px;font-size:12px;color:#555;line-height:1.8">
        1. Mark at ${(offset/mult.offset*3.2).toFixed(2)}" from end<br>
        2. Bend to 45°<br>
        3. Mark ${(offset/mult.offset*6.4).toFixed(2)}" from first bend<br>
        4. Roll conduit 180°, bend to 45°<br>
        5. Subtract ${shrink.toFixed(3)}" from cut length
      </div>
    </div>`;
  } else if(s.type==="stub"&&offset>0){
    const degMult=6.0;
    const mark=offset-(degMult);
    results=`<div class="bend-result">
      <div class="lbl" style="margin-bottom:8px">Stub-Up — Height: ${offset}"</div>
      <div class="irow">
        ${ib(Math.max(0,mark).toFixed(2)+'"',"Mark from end")}
        ${ib("90°","Bend angle")}
      </div>
      <div style="margin-top:10px;font-size:12px;color:#555;line-height:1.8">
        1. Subtract take-up (${degMult}") from stub height<br>
        2. Mark ${Math.max(0,mark).toFixed(2)}" from end of conduit<br>
        3. Place arrow at mark, bend to 90°<br>
        <strong style="color:#fbbf24">Take-up by size:</strong> 1/2"=6", 3/4"=6", 1"=6", 1-1/4"=8", 1-1/2"=8", 2"=8"
      </div>
    </div>`;
  } else if(s.type==="backtoback"&&offset>0&&dist>0){
    const tu=s.size==="1.25"||s.size==="1.5"?8:s.size==="2"?8:6;
    const m1=offset-tu;
    const m2=m1+dist;
    results=`<div class="bend-result">
      <div class="lbl" style="margin-bottom:8px">Back-to-Back — Stub: ${offset}" | Distance: ${dist}"</div>
      <div class="irow">
        ${ib(m1.toFixed(2)+'"',"First mark")}
        ${ib(m2.toFixed(2)+'"',"Second mark")}
        ${ib("90°+90°","Both bends")}
      </div>
      <div style="margin-top:10px;font-size:12px;color:#555;line-height:1.8">
        1. Mark ${m1.toFixed(2)}" from end (subtract take-up ${tu}")<br>
        2. Bend first 90°<br>
        3. Mark ${m2.toFixed(2)}" from end on same side<br>
        4. Flip 180°, bend second 90°
      </div>
    </div>`;
  } else if(s.type==="saddle"&&offset>0){
    const deg45mark=offset*.5;
    const deg22mark=offset*.125;
    results=`<div class="bend-result">
      <div class="lbl" style="margin-bottom:8px">3-Point Saddle — Obstacle Height: ${offset}"</div>
      <div class="irow">
        ${ib((offset*.5).toFixed(2)+'"',"Center mark")}
        ${ib((offset*.125).toFixed(2)+'"',"Side marks")}
        ${ib("45°+22.5°+22.5°","Bend angles")}
      </div>
      <div style="margin-top:10px;font-size:12px;color:#555;line-height:1.8">
        1. Mark center of obstacle on conduit<br>
        2. Bend center mark to 45°<br>
        3. Mark ${(offset*.125).toFixed(2)}" on each side of center<br>
        4. Flip conduit, bend each side mark to 22.5°<br>
        5. Shrink = ${(offset*.083).toFixed(3)}"
      </div>
    </div>`;
  }

  return card(`${cl("Conduit Bending Calculator")}
    <div><div class="lbl">BEND TYPE</div>${segs("bend.type",["offset","stub","backtoback","saddle"],s.type,true)}</div>
    <div class="row">
      <div><div class="lbl">CONDUIT SIZE</div>${segs("bend.size",["1/2",".75","1","1.25","1.5","2"],s.size,true)}</div>
    </div>
    <div class="row">
      ${s.type==="backtoback"?ni("b-off",s.type==="stub"?"STUB HEIGHT":"OFFSET/STUB HEIGHT",s.offset,'"'):ni("b-off",s.type==="stub"?"STUB HEIGHT":s.type==="saddle"?"OBSTACLE HEIGHT":"OFFSET HEIGHT",s.offset,'"')}
      ${s.type==="backtoback"?ni("b-dist","DISTANCE BETWEEN BENDS",s.dist,'"'):""}
    </div>
    ${btn("CALCULATE","calcBend()")}
    ${results}
    <div style="font-size:11px;color:#444;line-height:1.8;background:#0d0d0f;border-radius:8px;padding:10px;margin-top:4px">
      <strong style="color:#555">Common multipliers:</strong><br>
      10° bend = 6.0 | 22.5° = 2.6 | 30° = 2.0 | 45° = 1.4 | 60° = 1.2<br>
      Offset shrink: height × 0.25 (at 45°) | 0.06 (at 30°) | 0.32 (at 60°)
    </div>
  `)
}

function rConv(){
  const s=S.conv;
  const cat=CONVS[s.cat];
  const val=parseFloat(s.val)||0;
  let result="";

  if(s.cat==="temp"&&val){
    const c=s.from==="F"?(val-32)*5/9:s.from==="C"?val:val-273.15;
    const f=c*9/5+32,k=c+273.15;
    result=`<div style="display:flex;flex-direction:column;gap:6px;margin-top:4px">
      ${[["°F",f.toFixed(2)],["°C",c.toFixed(2)],["K",k.toFixed(2)]].map(([u,v])=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:#0d0d0f;border-radius:8px;border:1px solid #1e1e24">
        <span style="color:#555;font-size:13px">${u}</span>
        <span style="font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;color:#fbbf24">${v}</span>
      </div>`).join("")}
    </div>`;
  } else if(s.cat==="wire"&&s.from){
    const cm=WIRE_CMIL[s.from]||0;
    const sqin=(cm*Math.PI/4)*1e-6;
    result=`<div style="display:flex;flex-direction:column;gap:6px;margin-top:4px">
      ${[[`${s.from}`,s.from],[`Circular Mils`,cm.toLocaleString()],["sq inches",(cm/1273240).toFixed(6)],["sq mm",((cm/1273240)*645.16).toFixed(4)]].map(([l,v])=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:#0d0d0f;border-radius:8px;border:1px solid #1e1e24"><span style="color:#555;font-size:13px">${l}</span><span style="font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:800;color:#fbbf24">${v}</span></div>`).join("")}
    </div>`;
  } else if(cat&&cat.conv&&val){

function rAmz(g,mat){
  const m=mat.toLowerCase(),ir=[14,12,10].includes(parseInt(g))&&m==="copper";
  const pw=ir?`NM-B ${g}/2 Romex wire`:`THHN ${g} AWG ${m} wire`;
  return[{l:pw,s:"Primary wire"},{l:`${BR[g]||60}A circuit breaker`,s:"Breaker"},{l:(WT[g]?.c||"1/2 EMT").replace(/"/g,"in")+" conduit",s:"Conduit"}]
    .map(lk=>`<a href="https://www.amazon.com/s?k=${enc(lk.l)}" target="_blank" class="amz-a"><span style="font-size:17px">🔶</span><div style="flex:1"><div style="font-size:13px;font-weight:700;color:white">${lk.l}</div><div style="font-size:11px;color:#555">${lk.s}</div></div><span style="color:#f90">→</span></a>`).join("");
}

/* ── Conduit Fill ── */
function rConduit(){

    +card(`${cl("Fill Result")}
      <div class="irow">${ib(pct.toFixed(1)+"%","Fill %",ok?"#22c55e":"#ef4444")}${ib(max+"%","Max Allowed")}${ib(used.toFixed(4)+'in²',"Wire Area")}</div>
      <div class="${ok?"pass":"fail"}">${ok?`✓ PASS — ${(area-used).toFixed(4)}" remaining`:`✗ FAIL — Use larger conduit`}</div>

}

      </div>
      <label style="display:flex;align-items:center;gap:7px;cursor:pointer">
        <input type="checkbox" ${l.cont?"checked":""} style="accent-color:#fbbf24;width:15px;height:15px" onchange="S.load.loads[${i}].cont=this.checked;R()"/>
        <span style="font-size:12px;color:#666">Continuous load (×1.25 NEC)</span>

/* ── Job Cost ── */
function rJc(){
  const s=S.jc;
  const lc=s.items.filter(i=>i.cat==="labor").reduce((t,i)=>t+(parseFloat(i.q)||0)*(parseFloat(i.p)||0),0);
  const mc=s.items.filter(i=>i.cat==="material").reduce((t,i)=>t+(parseFloat(i.q)||0)*(parseFloat(i.p)||0),0);
  const sub=lc+mc,oh=sub*(parseFloat(s.oh)||0)/100,pr=(sub+oh)*(parseFloat(s.pr)||0)/100,tot=sub+oh+pr;
  const row=(item,i,cat)=>`<div style="display:flex;gap:6px;align-items:center;margin-bottom:7px">
    <input class="inp" style="flex:2;font-size:12px;padding:8px 9px" placeholder="${cat==="labor"?"Task":"Material"}" value="${item.d||""}" oninput="S.jc.items[${i}].d=this.value"/>
    <input type="number" class="inp" style="flex:0 0 50px;font-size:13px;padding:8px 5px;text-align:center" value="${item.q||""}" oninput="S.jc.items[${i}].q=this.value"/>
    <div style="position:relative;flex:1"><input type="number" class="inp" style="font-size:13px;padding:8px 7px 8px 15px;width:100%" value="${item.p||""}" oninput="S.jc.items[${i}].p=this.value"/><span style="position:absolute;left:5px;top:50%;transform:translateY(-50%);color:#444;font-size:12px">$</span></div>
    <span style="font-size:12px;font-weight:700;color:#fbbf24;min-width:50px;text-align:right">$${((parseFloat(item.q)||0)*(parseFloat(item.p)||0)).toFixed(2)}</span>

/* ── Calculate functions ── */
function calcWire(){
  const s=S.wire;s.amps=parseFloat(gv("w-a"));s.dist=parseFloat(gv("w-d"));
  if(!s.amps||!s.dist)return;
  const r=wr(s.amps,s.dist,s.vol,s.mat.toLowerCase(),s.phase==="3-Phase"?"3ph":"single");
  s.res=r.length===0?{err:true}:{mn:r[0],rec:r.find(g=>g.pct<=3)||r[r.length-1],all:r.slice(0,6)};
  R();
}
function calcOhms(){
  const s=S.ohms;s.v=gv("o-v");s.i=gv("o-i");s.r=gv("o-r");s.p=gv("o-p");
  const v=parseFloat(s.v),i=parseFloat(s.i),r=parseFloat(s.r);
  if(s.mode==="V"&&i&&r){s.v=(i*r).toFixed(4);s.p=(i*i*r).toFixed(4)}
  if(s.mode==="I"&&v&&r){s.i=(v/r).toFixed(4);s.p=(v*v/r).toFixed(4)}
  if(s.mode==="R"&&v&&i){s.r=(v/i).toFixed(4);s.p=(v*i).toFixed(4)}
  if(s.mode==="P"&&v&&i){s.p=(v*i).toFixed(4)}
  R();
}
function calcBox(){S.box.cond=gv("bx-c");S.box.dev=gv("bx-d");S.box.gnd=gv("bx-g");R()}
function calcJc(){S.jc.cl=gv("jc-cl");S.jc.oh=gv("jc-oh");S.jc.pr=gv("jc-pr");R()}
function calcTp(){
  const s=S.tp;s.kva=gv("tp-kva");s.kw=gv("tp-kw");s.amps=gv("tp-a");s.pf=gv("tp-pf");
  const v=parseFloat(s.vol),pf=parseFloat(s.pf)||1,s3=Math.sqrt(3);
  if(s.mode==="find-amps"){const kv=parseFloat(s.kva)||(parseFloat(s.kw)/pf);if(kv){s.amps=((kv*1000)/(s3*v)).toFixed(2);s.kva=kv.toFixed(3);s.kw=(kv*pf).toFixed(3)}}
  if(s.mode==="find-kva"){const a=parseFloat(s.amps);if(a){const kv=(a*s3*v)/1000;s.kva=kv.toFixed(3);s.kw=(kv*pf).toFixed(3)}}
  R();
}
function calcQuote(){
  const s=S.quote;s.biz=gv("q-biz");s.cl=gv("q-cl");s.addr=gv("q-addr");s.email=gv("q-em");s.ph=gv("q-ph");s.prev=true;R();
}

async function findStores(){
  const s=S.wire;
  if(GKEY==="YOUR_API_KEY_HERE"){s.sst="no_key";R();return}
  s.sst="locating";s.stores=[];R();
  navigator.geolocation.getCurrentPosition(async pos=>{
    s.sst="loading";R();
    try{
      await new Promise((res,rej)=>{
        if(window.google?.maps?.places){res();return}
        const sc=document.createElement("script");
        sc.src=`https://maps.googleapis.com/maps/api/js?key=${GKEY}&libraries=places`;
        sc.onload=res;sc.onerror=rej;document.head.appendChild(sc);
      });
      const div=document.createElement("div");
      const map=new google.maps.Map(div,{center:{lat:pos.coords.latitude,lng:pos.coords.longitude},zoom:13});
      const svc=new google.maps.places.PlacesService(map);
      const qs=["electrical supply store","Home Depot","Lowe's","Graybar Electric"];
      const all=[];const seen=new Set();
      await Promise.all(qs.map(q=>new Promise(r=>{
        svc.textSearch({query:q,location:{lat:pos.coords.latitude,lng:pos.coords.longitude},radius:20000},(results,status)=>{
          if(status===google.maps.places.PlacesServiceStatus.OK&&results){
            results.slice(0,3).forEach(p=>{
              if(!seen.has(p.place_id)){
                seen.add(p.place_id);
                const pl=p.geometry.location.lat(),pln=p.geometry.location.lng();
                const R=3958.8,dL=(pl-pos.coords.latitude)*Math.PI/180,dl=(pln-pos.coords.longitude)*Math.PI/180;
                const x=Math.sin(dL/2)**2+Math.cos(pos.coords.latitude*Math.PI/180)*Math.cos(pl*Math.PI/180)*Math.sin(dl/2)**2;
                all.push({name:p.name,address:p.formatted_address||p.vicinity,rating:p.rating,open:p.opening_hours?.open_now,placeId:p.place_id,distMi:R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))});
              }
            });
          }
          r();
        });
      })));
      s.stores=all.sort((a,b)=>a.distMi-b.distMi).slice(0,8);s.sst="done";
    }catch{s.sst="error"}
    R();
  },()=>{S.wire.sst="error";R()},{timeout:10000});
}

/* ── Tool registry ── */
const TOOLS={
  wire:{fn:rWire,plan:"free"},conduit:{fn:rConduit,plan:"pro"},box:{fn:rBox,plan:"pro"},
  ohms:{fn:rOhms,plan:"pro"},load:{fn:rLoad,plan:"pro"},motor:{fn:rMotor,plan:"pro"},
  "3phase":{fn:rTp,plan:"pro"},nema:{fn:rNema,plan:"pro"},bend:{fn:rBend,plan:"pro"},
  conv:{fn:rConv,plan:"pro"},xfmr:{fn:rXfmr,plan:"pro"},
  jobcost:{fn:rJc,plan:"pro"},mat:{fn:rMat,plan:"pro"},
  nec:{fn:rNec,plan:"pro"},exam:{fn:rExam,plan:"pro"},quote:{fn:rQuote,plan:"pro"},
  pricing:{fn:rPricing,plan:"free"},teams:{fn:rTeams,plan:"teams"},
};

const ALL_TOOLS=[
  {id:"wire",l:"Wire Gauge",ic:"⚡",pl:"free"},{id:"conduit",l:"Conduit Fill",ic:"🔵",pl:"pro"},
  {id:"box",l:"Box Fill",ic:"📦",pl:"pro"},{id:"ohms",l:"Ohm's Law",ic:"🔄",pl:"pro"},
  {id:"load",l:"Load Calc",ic:"📊",pl:"pro"},{id:"motor",l:"Motor FLA",ic:"⚙️",pl:"pro"},
  {id:"3phase",l:"3-Phase Power",ic:"🔋",pl:"pro"},{id:"nema",l:"NEMA Configs",ic:"🔌",pl:"pro"},
  {id:"bend",l:"Conduit Bending",ic:"↩️",pl:"pro"},{id:"conv",l:"Conversions",ic:"📏",pl:"pro"},
  {id:"xfmr",l:"Transformer Wiring",ic:"🔁",pl:"pro"},{id:"jobcost",l:"Job Cost",ic:"💰",pl:"pro"},
  {id:"mat",l:"Material Est.",ic:"🧱",pl:"pro"},{id:"nec",l:"NEC Reference",ic:"📋",pl:"pro"},
  {id:"exam",l:"Exam Prep",ic:"🎓",pl:"pro"},{id:"quote",l:"Quote Generator",ic:"📄",pl:"pro"},
  {id:"pricing",l:"Plans & Pricing",ic:"💳",pl:"free"},{id:"teams",l:"Teams",ic:"👥",pl:"teams"},
];

const MAIN_TABS=[
  {id:"wire",tid:"t-wire"},{id:"conduit",tid:"t-calc"},
  {id:"jobcost",tid:"t-job"},{id:"nec",tid:"t-learn"},
];

/* ── Nav ── */
let drawerOpen=false;
function toggleDrawer(){drawerOpen?closeDrawer():openDrawer()}
function openDrawer(){
  drawerOpen=true;
  document.getElementById("drawer").classList.add("on");
  document.getElementById("overlay").classList.add("on");
  document.getElementById("drw-grid").innerHTML=ALL_TOOLS.map(t=>`
    <button class="drw-item${tool===t.id?" on":""}" onclick="go('${t.id}');closeDrawer()">
      <span class="drw-ic">${t.ic}</span><span>${t.l}</span>
      ${!ok(t.pl)?`<span class="drw-lock">🔒</span>`:""}
    </button>`).join("");
}
function closeDrawer(){
  drawerOpen=false;
  document.getElementById("drawer").classList.remove("on");
  document.getElementById("overlay").classList.remove("on");
}

function go(id){tool=id;R();window.scrollTo(0,0)}

function updNav(){
  MAIN_TABS.forEach(t=>{
    const el=document.getElementById(t.tid);
    if(el)el.className="tab"+(t.id===tool?" on":"");
  });
  if(!MAIN_TABS.find(t=>t.id===tool)){
    document.getElementById("t-more").className="tab on";
  }
}

function updBadge(){
  const pl=PLANS[plan];const b=document.getElementById("plan-btn");
  if(!b)return;
  b.style.background=pl.c+"15";b.style.borderColor=pl.c+"33";b.style.color=pl.c;
  b.textContent=pl.l+(plan!=="teams"?" — Upgrade ↑":"");
}

/* ── Render ── */
function R(){
  updNav();updBadge();
  const tc=document.getElementById("tc");if(!tc)return;
  const t=TOOLS[tool];if(!t){tc.innerHTML="";return}
  if(!ok(t.plan)){
    const c=t.plan==="teams"?"#60a5fa":"#fbbf24";
    tc.innerHTML=`<div class="lock-wrap">
      <div style="filter:blur(3px);pointer-events:none;user-select:none;opacity:0.35">${t.fn()}</div>
      <div class="lock-ov">
        <div style="font-size:32px">🔒</div>
        <div style="font-size:17px;font-weight:700">${t.plan==="teams"?"Teams Feature":"Pro Feature"}</div>
        <div style="font-size:13px;color:#555;text-align:center;max-width:190px">Upgrade to ${t.plan==="teams"?"Teams ($19/mo)":"Pro ($9/mo)"}</div>
        <button class="btn" style="width:170px;background:${c};color:${t.plan==="pro"?"#0d0d0f":"white"}" onclick="go('pricing')">Upgrade →</button>
      </div></div>`;
    return;
  }
  tc.innerHTML=`<div class="fade-up">${t.fn()}</div>`;
}

R();
</script>
